    /* BibTeX Helper Bar */

<body>

  <!-- Hidden file input for direct "Upload & Crop" -->
  <input type="file" id="cbl-hidden-file-input" accept="image/*" style="display:none" />

  <!-- Automatic BibTeX & Image Editor Extension Logic -->
  <script>
    (function () {
      // -------------------------------------------------------------
      // 1. REACT INPUT HELPER
      // -------------------------------------------------------------
      function setReactInputValue(input, value) {
        if (!input) return;
        if (input instanceof HTMLSelectElement || input.tagName === 'SELECT') {
          input.value = value;
          for (let i = 0; i < input.options.length; i++) {
            if (input.options[i].value === value || input.options[i].text === value) {
              input.selectedIndex = i;
              break;
            }
          }
          input.dispatchEvent(new Event('input', { bubbles: true }));
          input.dispatchEvent(new Event('change', { bubbles: true }));
          return;
        }

        const prototype = input instanceof HTMLTextAreaElement 
          ? window.HTMLTextAreaElement.prototype 
          : window.HTMLInputElement.prototype;
        const descriptor = Object.getOwnPropertyDescriptor(prototype, 'value');
        if (descriptor && descriptor.set) {
          descriptor.set.call(input, value);
        } else {
          input.value = value;
        }
        input.dispatchEvent(new Event('input', { bubbles: true }));
        input.dispatchEvent(new Event('change', { bubbles: true }));
      }

      // -------------------------------------------------------------
      // 2. AUTOMATIC PUBLICATION METADATA & BIBTEX GENERATOR
      // -------------------------------------------------------------
      function formatBibtex(raw) {
        let clean = raw.trim();
        clean = clean.replace(/,\s*([a-zA-Z0-9_-]+)\s*=/g, ',\n  $1 =');
        clean = clean.replace(/}\s*$/, '\n}');
        return clean;
      }

      async function fetchCrossrefData(doi) {
        const cleanDoi = encodeURIComponent(doi.trim());
        
        // Fetch BibTeX, APA citation, and metadata in parallel via Crossref public API (CORS enabled)
        const [bibtexRes, citationRes, jsonRes] = await Promise.allSettled([
          fetch(`https://api.crossref.org/works/${cleanDoi}/transform/application/x-bibtex`, {
            headers: { 'Accept': 'application/x-bibtex' }
          }),
          fetch(`https://api.crossref.org/works/${cleanDoi}/transform/text/x-bibliography`, {
            headers: { 'Accept': 'text/x-bibliography' }
          }),
          fetch(`https://api.crossref.org/works/${cleanDoi}`).then(r => r.json())
        ]);

        let bibtex = null;
        if (bibtexRes.status === 'fulfilled' && bibtexRes.value.ok) {
          const text = await bibtexRes.value.text();
          if (text && text.includes('@')) bibtex = formatBibtex(text);
        }

        let citation = null;
        let extractedDoiUrl = null;
        if (citationRes.status === 'fulfilled' && citationRes.value.ok) {
          const text = await citationRes.value.text();
          if (text) {
            let rawCitation = text.trim();
            // Match and extract trailing DOI/URL link (e.g. https://doi.org/..., http://dx.doi.org/..., doi: 10....)
            const urlMatch = rawCitation.match(/\s*(?:https?:\/\/(?:dx\.)?doi\.org\/[^\s]+|https?:\/\/[^\s]+|doi:\s*10\.[^\s]+)\s*$/i);
            if (urlMatch) {
              const matchedUrl = urlMatch[0].trim().replace(/\.$/, '');
              if (matchedUrl.startsWith('http')) {
                extractedDoiUrl = matchedUrl;
              } else if (matchedUrl.toLowerCase().startsWith('doi:')) {
                const pureDoi = matchedUrl.replace(/^doi:\s*/i, '');
                extractedDoiUrl = `https://doi.org/${pureDoi}`;
              }
              rawCitation = rawCitation.slice(0, urlMatch.index).trim();
            }
            // Ensure citation ends cleanly with a period and no trailing separators
            rawCitation = rawCitation.replace(/[,;:]\s*$/, '').trim();
            if (rawCitation && !rawCitation.endsWith('.')) {
              rawCitation += '.';
            }
            citation = rawCitation;
          }
        }

        let year = null;
        let canonicalUrl = extractedDoiUrl || `https://doi.org/${doi.trim()}`;
        if (jsonRes.status === 'fulfilled' && jsonRes.value && jsonRes.value.message) {
          const msg = jsonRes.value.message;
          if (msg.URL && msg.URL.startsWith('http')) {
            canonicalUrl = msg.URL;
          }
          const issued = msg['published-print'] || msg['published-online'] || msg['issued'] || msg['created'];
          if (issued && issued['date-parts'] && issued['date-parts'][0] && issued['date-parts'][0][0]) {
            year = String(issued['date-parts'][0][0]);
          }
        }

        if (!year && citation) {
          const yrMatch = citation.match(/\((\d{4})\)/);
          if (yrMatch) year = yrMatch[1];
        }

        return { bibtex, citation, year, doiUrl: canonicalUrl };
      }

      function synthesizeBibtex(citation, year, url) {
        const parts = (citation || '').split('.');
        const author = parts[0] ? parts[0].trim() : 'Conscious Brain Lab';
        const title = parts[1] ? parts[1].trim() : (citation.trim() || 'Research Publication');
        const firstAuthor = author.split(',')[0].replace(/[^a-zA-Z]/g, '').toLowerCase() || 'cbl';
        const cleanYear = year ? String(year).trim() : '2024';
        const key = `${firstAuthor}${cleanYear}`;

        return `@article{${key},
  author = {${author}},
  title = {${title}},
  year = {${cleanYear}},
  journal = {Conscious Brain Lab Publications},
  url = {${url || 'https://www.consciousbrainlab.com'}}
}`;
      }

      async function executeAutoFetch(statusText, fetchBtn) {
        if (fetchBtn) fetchBtn.disabled = true;
        if (statusText) {
          statusText.className = 'cbl-fetch-status';
          statusText.textContent = '🔍 Reading DOI / Paper URL...';
        }

        try {
          const paperUrlInput = document.querySelector('input[id*="paper_url"], input[name*="paper_url"]');
          const paperUrl = paperUrlInput ? paperUrlInput.value.trim() : '';
          const citationEl = document.querySelector('textarea[id*="citation"], input[id*="citation"]');
          const bibtexArea = document.querySelector('textarea[id*="bibtex"], textarea[name*="bibtex"]');
          const sectionEl = document.querySelector('select[id*="year_group"], select[name*="year_group"], input[id*="year_group"], input[name*="year_group"], [id*="year_group"] select, [id*="year_group"] input');

          const doiMatch = paperUrl.match(/(10\.\d{4,9}\/[-._;()/:A-Za-z0-9]+)/i);

          if (!doiMatch) {
            if (statusText) {
              statusText.className = 'cbl-fetch-status error';
              statusText.textContent = '⚠️ Please enter a valid DOI or paper link in the DOI field above.';
            }
            return;
          }

          const doi = doiMatch[1].replace(/\.$/, '');
          if (statusText) statusText.textContent = `⏳ Resolving DOI: ${doi} via Crossref...`;

          const data = await fetchCrossrefData(doi);

          let updatedFields = [];

          // 1. Populate DOI field with canonical https://doi.org/... entry
          const targetDoiUrl = data.doiUrl || `https://doi.org/${doi}`;
          if (paperUrlInput && paperUrlInput.value !== targetDoiUrl) {
            setReactInputValue(paperUrlInput, targetDoiUrl);
            updatedFields.push('DOI Link');
          }

          // 2. Populate Full Citation Text (clean, without trailing DOI link)
          if (citationEl && data.citation) {
            setReactInputValue(citationEl, data.citation);
            updatedFields.push('Citation');
          }

          // Determine numeric calendar year for BibTeX fallback
          let calYear = data.year || '';
          if (!calYear && sectionEl && sectionEl.value) {
            const m = sectionEl.value.match(/\b(19\d\d|20\d\d)\b/);
            if (m) calYear = m[1];
          }
          if (!calYear && citationEl && citationEl.value) {
            const m = citationEl.value.match(/\b(19\d\d|20\d\d)\b/);
            if (m) calYear = m[1];
          }

          // 3. Populate BibTeX
          if (bibtexArea) {
            if (data.bibtex) {
              setReactInputValue(bibtexArea, data.bibtex);
              updatedFields.push('BibTeX');
            } else if (citationEl && citationEl.value) {
              const fallback = synthesizeBibtex(citationEl.value, calYear || '2026', targetDoiUrl);
              setReactInputValue(bibtexArea, fallback);
              updatedFields.push('BibTeX (synthesized)');
            }
          }

          // 4. Populate Year / Section
          if (sectionEl && data.year) {
            const curVal = (sectionEl.value || '').trim();
            // If empty, default 2026, or purely a 4-digit year, update to DOI year
            if (!curVal || curVal === '2026' || /^\d{4}$/.test(curVal)) {
              setReactInputValue(sectionEl, data.year);
              updatedFields.push('Year / Section');
            }
          }

          if (statusText) {
            statusText.className = 'cbl-fetch-status';
            statusText.textContent = `✓ Populated ${updatedFields.join(', ')} from Crossref!`;
          }

        } catch (err) {
          console.error('Auto-fetch metadata error:', err);
          if (statusText) {
            statusText.className = 'cbl-fetch-status error';
            statusText.textContent = `❌ Error: ${err.message}`;
          }
        } finally {
          if (fetchBtn) fetchBtn.disabled = false;
        }
      }

      function attachPublicationHelpers() {
        // 1. DOI field auto-fetch button (directly below DOI field at top of form)
        const paperUrlInput = document.querySelector('input[id*="paper_url"], input[name*="paper_url"]');
        if (paperUrlInput) {
          const parent = paperUrlInput.parentNode;
          if (parent && !parent.querySelector('.cbl-doi-fetch-bar')) {
            const bar = document.createElement('div');
            bar.className = 'cbl-doi-fetch-bar cbl-bibtex-helper';
            bar.style.marginTop = '8px';
            bar.style.marginBottom = '8px';
            bar.innerHTML = `
              <div style="display: flex; align-items: center; gap: 10px; flex-wrap: wrap;">
                <button type="button" class="cbl-fetch-btn" id="cbl-btn-fetch-doi" style="background: #0284c7;">
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon></svg>
                  ✨ Auto-fetch Citation, Year &amp; BibTeX from DOI
                </button>
                <span class="cbl-fetch-status" id="cbl-doi-status-text"></span>
              </div>
              <span style="font-size: 11px; color: #0369a1; font-weight: 500;">Populates Citation, Year &amp; BibTeX via Crossref</span>
            `;

            parent.appendChild(bar);

            const btn = bar.querySelector('#cbl-btn-fetch-doi');
            const status = bar.querySelector('#cbl-doi-status-text');
            btn.addEventListener('click', () => executeAutoFetch(status, btn));
          }
        }

        // 2. BibTeX field auto-fetch button (above BibTeX textarea)
        const bibtexArea = document.querySelector('textarea[id*="bibtex"], textarea[name*="bibtex"]');
        if (bibtexArea) {
          const parentControl = bibtexArea.closest('div');
          if (parentControl && !parentControl.querySelector('.cbl-bibtex-helper')) {
            const helperBar = document.createElement('div');
            helperBar.className = 'cbl-bibtex-helper';
            helperBar.innerHTML = `
              <div style="display: flex; align-items: center; gap: 10px;">
                <button type="button" class="cbl-fetch-btn" id="cbl-btn-fetch-bib">
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon></svg>
                  ✨ Auto-fetch BibTeX &amp; Citation
                </button>
                <span class="cbl-fetch-status" id="cbl-bib-status-text"></span>
              </div>
              <span style="font-size: 11px; color: #6b7280;">Crossref metadata</span>
            `;

            bibtexArea.parentNode.insertBefore(helperBar, bibtexArea);

            const btn = helperBar.querySelector('#cbl-btn-fetch-bib');
            const status = helperBar.querySelector('#cbl-bib-status-text');
            btn.addEventListener('click', () => executeAutoFetch(status, btn));
          }
        }
      }

      // -------------------------------------------------------------
      // 3. IMAGE EDITOR & CROPPER EXTENSION
      // -------------------------------------------------------------
      let cropperInstance = null;
      let activeImageWidget = null;
      let currentScaleX = 1;

      const modal = document.getElementById('cbl-crop-modal');
      const cropperImg = document.getElementById('cbl-cropper-image');
      const dimensionsBadge = document.getElementById('cbl-crop-dimensions');
      const saveCropBtn = document.getElementById('cbl-save-crop');
      const cancelCropBtn = document.getElementById('cbl-cancel-crop');
      const closeModalBtn = document.getElementById('cbl-close-modal');
      const hiddenFileInput = document.getElementById('cbl-hidden-file-input');

      function openCropper(imageSrc, widgetEl, defaultRatio = 1) {
        activeImageWidget = widgetEl;
        currentScaleX = 1;
        saveCropBtn.disabled = false;
        saveCropBtn.innerHTML = '<span>✓</span> Apply &amp; Save to CMS';

        // Select default ratio button
        document.querySelectorAll('.cbl-aspect-btn-group .cbl-pill-btn').forEach(btn => {
          const ratio = parseFloat(btn.dataset.ratio);
          if ((isNaN(ratio) && isNaN(defaultRatio)) || Math.abs(ratio - defaultRatio) < 0.05) {
            btn.classList.add('active');
          } else {
            btn.classList.remove('active');
          }
        });

        // Set image source
        cropperImg.src = imageSrc;
        modal.classList.add('active');

        if (cropperInstance) {
          cropperInstance.destroy();
        }

        cropperInstance = new Cropper(cropperImg, {
          aspectRatio: defaultRatio,
          viewMode: 1,
          autoCropArea: 0.9,
          responsive: true,
          crop(event) {
            const w = Math.round(event.detail.width);
            const h = Math.round(event.detail.height);
            dimensionsBadge.textContent = `Framing: ${w} × ${h} px`;
          }
        });
      }

      function closeCropper() {
        modal.classList.remove('active');
        if (cropperInstance) {
          cropperInstance.destroy();
          cropperInstance = null;
        }
        activeImageWidget = null;
      }

      closeModalBtn.addEventListener('click', closeCropper);
      cancelCropBtn.addEventListener('click', closeCropper);
      modal.addEventListener('click', (e) => {
        if (e.target === modal) closeCropper();
      });

      // Aspect Ratio Controls
      document.querySelectorAll('.cbl-aspect-btn-group .cbl-pill-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          document.querySelectorAll('.cbl-aspect-btn-group .cbl-pill-btn').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          const ratio = parseFloat(btn.dataset.ratio);
          if (cropperInstance) {
            cropperInstance.setAspectRatio(isNaN(ratio) ? NaN : ratio);
          }
        });
      });

      // Transform Controls
      document.getElementById('cbl-rot-left').addEventListener('click', () => {
        if (cropperInstance) cropperInstance.rotate(-90);
      });
      document.getElementById('cbl-rot-right').addEventListener('click', () => {
        if (cropperInstance) cropperInstance.rotate(90);
      });
      document.getElementById('cbl-flip-h').addEventListener('click', () => {
        if (cropperInstance) {
          currentScaleX = -currentScaleX;
          cropperInstance.scaleX(currentScaleX);
        }
      });
      document.getElementById('cbl-reset').addEventListener('click', () => {
        if (cropperInstance) {
          cropperInstance.reset();
          currentScaleX = 1;
        }
      });

      // Persist Media Helper (Supports Local Backend & GitHub Mode)
      async function persistCroppedFile(relPath, base64Data) {
        // Try local server
        try {
          const res = await fetch('http://127.0.0.1:8081/api/v1', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              action: 'persistMedia',
              params: {
                asset: {
                  path: relPath,
                  content: base64Data,
                  encoding: 'base64'
                }
              }
            })
          });
          if (res.ok) return true;
        } catch (e) {
          console.warn('Local persistMedia failed, will try CMS backend:', e);
        }

        // Try Decap backend if available
        if (window.CMS && typeof window.CMS.getBackend === 'function') {
          const backend = window.CMS.getBackend();
          if (backend && typeof backend.persistMedia === 'function') {
            const byteCharacters = atob(base64Data);
            const byteNumbers = new Array(byteCharacters.length);
            for (let i = 0; i < byteCharacters.length; i++) {
              byteNumbers[i] = byteCharacters.charCodeAt(i);
            }
            const blob = new Blob([new Uint8Array(byteNumbers)], { type: relPath.endsWith('.png') ? 'image/png' : 'image/jpeg' });
            const file = new File([blob], relPath.split('/').pop(), { type: blob.type });
            await backend.persistMedia(file);
            return true;
          }
        }
        return true;
      }

      // Save Cropped Image
      saveCropBtn.addEventListener('click', async () => {
        if (!cropperInstance || !activeImageWidget) return;

        saveCropBtn.disabled = true;
        saveCropBtn.textContent = '⏳ Processing & Saving...';

        try {
          const maxWidth = parseInt(document.getElementById('cbl-max-width').value, 10);
          const format = document.getElementById('cbl-img-format').value;
          const quality = format === 'image/jpeg' ? 0.88 : 1.0;

          const canvas = cropperInstance.getCroppedCanvas({
            maxWidth: maxWidth,
            maxHeight: maxWidth,
            imageSmoothingEnabled: true,
            imageSmoothingQuality: 'high'
          });

          const dataUrl = canvas.toDataURL(format, quality);
          const base64Data = dataUrl.split(',')[1];
          const ext = format === 'image/png' ? 'png' : 'jpg';
          const filename = `crop_${Date.now()}.${ext}`;
          const relPath = `assets/images/${filename}`;

          // Save file
          await persistCroppedFile(relPath, base64Data);

          // Find "Replace with URL" button inside active image widget
          const replaceBtn = Array.from(activeImageWidget.querySelectorAll('button')).find(b => 
            b.textContent.includes('Replace with URL')
          );

          if (replaceBtn) {
            const oldPrompt = window.prompt;
            window.prompt = () => `/${relPath}`;
            replaceBtn.click();
            window.prompt = oldPrompt;
          }

          // Directly update thumbnail preview immediately
          const previewImg = activeImageWidget.querySelector('img');
          if (previewImg) {
            previewImg.src = dataUrl;
          }

          closeCropper();
        } catch (err) {
          console.error('Failed to save cropped image:', err);
          alert('Error saving cropped image: ' + err.message);
          saveCropBtn.disabled = false;
          saveCropBtn.textContent = 'Apply & Save to CMS';
        }
      });

      // Handle Hidden File Upload & Crop
      hiddenFileInput.addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (!file || !activeImageWidget) return;

        const reader = new FileReader();
        reader.onload = (evt) => {
          const isMember = window.location.hash.includes('/members');
          openCropper(evt.target.result, activeImageWidget, isMember ? 1 : 1.77777777778);
        };
        reader.readAsDataURL(file);
        hiddenFileInput.value = '';
      });

      // Attach Image Editing Buttons to Decap CMS Image Widgets
      function attachImageEditorHelpers() {
        // Find all Decap CMS image preview containers
        const images = document.querySelectorAll('div[class*="ControlContainer"] img, div[class*="image"] img');
        
        images.forEach(img => {
          const widgetContainer = img.closest('div[class*="ControlContainer"]') || img.closest('div');
          if (!widgetContainer) return;

          // Check if already injected
          if (widgetContainer.querySelector('.cbl-img-toolbar')) return;

          const toolbar = document.createElement('div');
          toolbar.className = 'cbl-img-toolbar';
          toolbar.innerHTML = `
            <button type="button" class="cbl-crop-btn" title="Crop, rotate, and resize this image">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M6.13 1L6 16a2 2 0 0 0 2 2h15"></path><path d="M1 6.13L16 6a2 2 0 0 1 2 2v15"></path></svg>
              ✂️ Crop &amp; Resize
            </button>
            <button type="button" class="cbl-upload-crop-btn" title="Upload a new photo and open the crop tool">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg>
              📁 Upload &amp; Crop New
            </button>
          `;

          // Append toolbar below image
          img.parentNode.appendChild(toolbar);

          const cropBtn = toolbar.querySelector('.cbl-crop-btn');
          const uploadCropBtn = toolbar.querySelector('.cbl-upload-crop-btn');

          cropBtn.addEventListener('click', () => {
            const isMember = window.location.hash.includes('/members');
            openCropper(img.src, widgetContainer, isMember ? 1 : 1.77777777778);
          });

          uploadCropBtn.addEventListener('click', () => {
            activeImageWidget = widgetContainer;
            hiddenFileInput.click();
          });
        });
      }

      // Automatically keep publications in collection overview ordered identical to the live site
      let isSortingPublications = false;
      const pubsDataMap = new Map();
      async function initPubsData() {
        try {
          const res = await fetch('/data/publications.json');
          if (res.ok) {
            const data = await res.json();
            data.forEach((p, idx) => {
              if (p.id) pubsDataMap.set(p.id, { ...p, siteIndex: idx });
            });
            sortPublicationCardsInOverview();
          }
        } catch (e) {
          // Fallback to text parsing
        }
      }
      initPubsData();

      function sortPublicationCardsInOverview() {
        if (isSortingPublications) return;
        if (!window.location.hash.includes('/collections/publications')) return;
        if (window.location.hash.includes('/entries/')) return;

        const cardLinks = Array.from(document.querySelectorAll('a[href*="#/collections/publications/entries/"]'));
        if (cardLinks.length < 2) return;

        // Resolve the common container and the top-level card items to sort
        let container = cardLinks[0].parentElement;
        const allSameParent = cardLinks.every(l => l.parentElement === container);
        let itemsToSort = cardLinks;

        if (!allSameParent) {
          container = cardLinks[0].closest('[role="list"], [class*="List"], [class*="Grid"], [class*="Collection"]') 
                   || cardLinks[0].parentElement.parentElement;
          if (!container) return;
          const uniqueItems = new Set();
          itemsToSort = cardLinks.map(l => {
            let curr = l;
            while (curr && curr.parentElement && curr.parentElement !== container) {
              curr = curr.parentElement;
            }
            return curr;
          }).filter(el => {
            if (!el || uniqueItems.has(el)) return false;
            uniqueItems.add(el);
            return true;
          });
        }

        if (!container || itemsToSort.length < 2) return;

        function getCardWeight(el) {
          // Check by entry slug/id if present in href
          const link = el.matches('a[href*="#/collections/publications/entries/"]') ? el : el.querySelector('a[href*="#/collections/publications/entries/"]');
          if (link) {
            const m = (link.getAttribute('href') || '').match(/entries\/([^/?#]+)/);
            if (m && m[1]) {
              const pubId = decodeURIComponent(m[1]);
              if (pubsDataMap.has(pubId)) {
                const pub = pubsDataMap.get(pubId);
                const yg = (pub.year_group || pub.year || '').toLowerCase();
                if (yg.includes('rxiv') || yg.includes('submitted') || yg.includes('preprint') || yg.includes('review')) {
                  return 9999;
                }
                const yrMatch = yg.match(/\b(19\d\d|20\d\d)\b/) || (pub.citation || '').match(/\b(19\d\d|20\d\d)\b/);
                if (yrMatch) return parseInt(yrMatch[0], 10);
              }
            }
          }

          // Fallback to text inspection
          const text = (el.textContent || '').toLowerCase();
          const match = text.match(/^\s*\(([^)]+)\)/);
          const prefix = match ? match[1] : '';
          if (prefix.includes('rxiv') || prefix.includes('submitted') || prefix.includes('preprint') || prefix.includes('review') || text.includes('submitted or on rxiv') || text.includes('submitted') || text.includes('rxiv')) {
            return 9999;
          }
          const yrMatch = prefix.match(/\d{4}/) || text.match(/\b(19\d\d|20\d\d)\b/);
          if (yrMatch) {
            return parseInt(yrMatch[0], 10);
          }
          return 0;
        }

        const sortedItems = [...itemsToSort].sort((a, b) => {
          const weightA = getCardWeight(a);
          const weightB = getCardWeight(b);
          if (weightB !== weightA) {
            return weightB - weightA;
          }
          return (a.textContent || '').localeCompare(b.textContent || '');
        });

        let needsReorder = false;
        for (let i = 0; i < itemsToSort.length; i++) {
          if (itemsToSort[i] !== sortedItems[i]) {
            needsReorder = true;
            break;
          }
        }

        if (needsReorder) {
          isSortingPublications = true;
          sortedItems.forEach(item => container.appendChild(item));
          setTimeout(() => { isSortingPublications = false; }, 60);
        }
      }

      // Continuous observer to attach helpers when user opens entries
      const observer = new MutationObserver(() => {
        attachPublicationHelpers();
        attachImageEditorHelpers();
        sortPublicationCardsInOverview();
      });

      document.addEventListener('DOMContentLoaded', () => {
        observer.observe(document.body, { childList: true, subtree: true });
        attachPublicationHelpers();
        attachImageEditorHelpers();
        sortPublicationCardsInOverview();
      });
    })();
  </script>
