<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Content Manager | Conscious Brain Lab</title>
  <link rel="icon" type="image/jpeg" href="/assets/images/CBL_logo.png" />
  <style>
    .cbl-bibtex-helper {
      margin-bottom: 8px;
      padding: 8px 12px;
      background: #f0fdf4;
      border: 1px solid #bbf7d0;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px;
      animation: fadeIn 0.3s ease;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-4px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .cbl-fetch-btn {
      background: #16a34a;
      color: #ffffff;
      border: none;
      padding: 6px 14px;
      border-radius: 6px;
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: background 0.2s, transform 0.1s;
    }
    .cbl-fetch-btn:hover {
      background: #15803d;
    }
    .cbl-fetch-btn:active {
      transform: scale(0.98);
    }
    .cbl-fetch-btn:disabled {
      background: #9ca3af;
      cursor: not-allowed;
    }
    .cbl-fetch-status {
      font-size: 12px;
      font-weight: 500;
      color: #166534;
    }
    .cbl-fetch-status.error {
      color: #b91c1c;
    }
  </style>
</head>
<body>
  <!-- Official Decap CMS Runtime -->
  <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>

  <!-- Automatic BibTeX Generator & DOI Resolver Extension -->
  <script>
    (function () {
      function setReactInputValue(input, value) {
        const prototype = input instanceof HTMLTextAreaElement 
          ? window.HTMLTextAreaElement.prototype 
          : window.HTMLInputElement.prototype;
        const descriptor = Object.getOwnPropertyDescriptor(prototype, 'value');
        if (descriptor && descriptor.set) {
          descriptor.set.call(input, value);
        } else {
          input.value = value;
        }
        input.dispatchEvent(new Event('input', { bubbles: true }));
        input.dispatchEvent(new Event('change', { bubbles: true }));
      }

      function formatBibtex(raw) {
        let clean = raw.trim();
        // Ensure clean indentation
        clean = clean.replace(/,\s*([a-zA-Z0-9_-]+)\s*=/g, ',\n  $1 =');
        clean = clean.replace(/}\s*$/, '\n}');
        return clean;
      }

      async function fetchBibtexFromDoi(doi) {
        // Try Crossref Content Negotiation API (CORS enabled worldwide)
        const url = `https://api.crossref.org/works/${encodeURIComponent(doi)}/transform/application/x-bibtex`;
        const res = await fetch(url, {
          headers: {
            'Accept': 'application/x-bibtex'
          }
        });
        if (!res.ok) {
          throw new Error(`Crossref returned HTTP ${res.status}`);
        }
        const text = await res.text();
        if (!text || !text.includes('@')) {
          throw new Error('Invalid BibTeX response from Crossref');
        }
        return formatBibtex(text);
      }

      function synthesizeBibtex(citation, year, url) {
        const parts = citation.split('.');
        const author = parts[0] ? parts[0].trim() : 'Conscious Brain Lab';
        const title = parts[1] ? parts[1].trim() : (citation.trim() || 'Research Publication');
        const firstAuthor = author.split(',')[0].replace(/[^a-zA-Z]/g, '').toLowerCase() || 'cbl';
        const cleanYear = year ? String(year).trim() : '2024';
        const key = `${firstAuthor}${cleanYear}`;

        return `@article{${key},
  author = {${author}},
  title = {${title}},
  year = {${cleanYear}},
  journal = {Conscious Brain Lab Publications},
  url = {${url || 'https://www.consciousbrainlab.com'}}
}`;
      }

      function attachBibtexHelper() {
        // Find bibtex textarea
        const bibtexArea = document.querySelector('textarea[id*="bibtex"], textarea[name*="bibtex"]');
        if (!bibtexArea) return;

        const parentControl = bibtexArea.closest('div');
        if (!parentControl) return;

        // Prevent duplicate buttons
        if (parentControl.querySelector('.cbl-bibtex-helper')) return;

        const helperBar = document.createElement('div');
        helperBar.className = 'cbl-bibtex-helper';
        helperBar.innerHTML = `
          <div style="display: flex; align-items: center; gap: 10px;">
            <button type="button" class="cbl-fetch-btn" id="cbl-btn-fetch">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon></svg>
              ✨ Auto-fetch BibTeX from DOI / URL
            </button>
            <span class="cbl-fetch-status" id="cbl-status-text"></span>
          </div>
          <span style="font-size: 11px; color: #6b7280;">Instant Crossref publisher metadata</span>
        `;

        bibtexArea.parentNode.insertBefore(helperBar, bibtexArea);

        const fetchBtn = helperBar.querySelector('#cbl-btn-fetch');
        const statusText = helperBar.querySelector('#cbl-status-text');

        fetchBtn.addEventListener('click', async () => {
          fetchBtn.disabled = true;
          statusText.className = 'cbl-fetch-status';
          statusText.textContent = '🔍 Reading DOI / Paper URL...';

          try {
            // Find paper_url input
            const paperUrlInput = document.querySelector('input[id*="paper_url"], input[name*="paper_url"]');
            const paperUrl = paperUrlInput ? paperUrlInput.value.trim() : '';

            // Find citation and year for fallback
            const citationEl = document.querySelector('textarea[id*="citation"], input[id*="citation"]');
            const citation = citationEl ? citationEl.value.trim() : '';
            const yearEl = document.querySelector('input[id*="year"]');
            const year = yearEl ? yearEl.value.trim() : '2024';

            // Match DOI
            const doiMatch = paperUrl.match(/(10\.\d{4,9}\/[-._;()/:A-Za-z0-9]+)/);
            
            if (doiMatch) {
              const doi = doiMatch[1].replace(/\.$/, '');
              statusText.textContent = `⏳ Resolving DOI: ${doi}...`;
              try {
                const bibtex = await fetchBibtexFromDoi(doi);
                setReactInputValue(bibtexArea, bibtex);
                statusText.textContent = '✓ Official BibTeX fetched from Crossref!';
              } catch (doiErr) {
                console.warn('DOI fetch failed, falling back to synthesis:', doiErr);
                const fallback = synthesizeBibtex(citation, year, paperUrl);
                setReactInputValue(bibtexArea, fallback);
                statusText.textContent = '✓ Generated standard BibTeX citation!';
              }
            } else {
              if (!citation) {
                statusText.className = 'cbl-fetch-status error';
                statusText.textContent = '⚠️ Please enter Paper DOI or Citation text first.';
                return;
              }
              const synthesized = synthesizeBibtex(citation, year, paperUrl);
              setReactInputValue(bibtexArea, synthesized);
              statusText.textContent = '✓ Generated clean BibTeX citation!';
            }
          } catch (err) {
            console.error('BibTeX generation error:', err);
            statusText.className = 'cbl-fetch-status error';
            statusText.textContent = `❌ Error: ${err.message}`;
          } finally {
            fetchBtn.disabled = false;
          }
        });
      }

      // Observe DOM mutations to attach helper whenever publication editor opens
      const observer = new MutationObserver(() => {
        attachBibtexHelper();
      });

      document.addEventListener('DOMContentLoaded', () => {
        observer.observe(document.body, { childList: true, subtree: true });
        attachBibtexHelper();
      });
    })();
  </script>
</body>
</html>
